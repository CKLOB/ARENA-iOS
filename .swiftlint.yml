# SwiftLint 설정
# https://github.com/realm/SwiftLint

# 검사에서 제외할 경로
excluded:
  - Pods
  - .build
  - DerivedData

# 비활성화할 규칙
disabled_rules:
  - trailing_whitespace

# 활성화할 opt-in 규칙
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# 경고 한도
line_length:
  warning: 120
  error: 200

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

force_cast: warning
force_try: warning
